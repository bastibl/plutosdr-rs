[package]
name = "plutosdr-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust PlutoSDR IIO-over-USB driver using nusb"

[lib]
name = "plutosdr"

[features]
default = []
smol = ["nusb/smol"]
tokio = ["nusb/tokio"]

[dependencies]
nusb = "0.2.7"
num-complex = "0.4"
web-time = "1"
roxmltree = "0.21"
futures-lite = "2"
futures-timer = { version = "3", features = ["wasm-bindgen"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

[[example]]
name = "info_async"
required-features = ["smol"]

[[example]]
name = "rx_async"
required-features = ["smol"]
